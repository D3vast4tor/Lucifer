[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lucifer-local"
version = "0.4.0"
description = "Local AI agent, terminal cortex and offline adapter consolidation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "textual>=8.2.8,<9", "rich>=13,<15", "PyYAML>=6,<7",
  "jsonschema>=4.23,<5", "pypdf>=6,<7", "openpyxl>=3.1,<4",
  "python-docx>=1.2,<2", "Pillow>=12,<13", "av>=16,<18",
  "striprtf>=0.0.29,<1", "xlrd>=2,<3", "odfpy>=1.4,<2", "defusedxml>=0.7,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2"]
train = ["torch>=2.6", "transformers>=4.51,<6", "peft>=0.15,<1", "accelerate>=1.5,<2", "datasets>=3,<5", "bitsandbytes>=0.45; platform_system == 'Linux'"]

[project.scripts]
lucifer = "lucifer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lucifer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
